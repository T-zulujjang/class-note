<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>캘리그래피 판서 그림판</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#ECEEF2; --dot:#C9CED8;
  --panel:rgba(255,255,255,.94); --line:#DDE1E8; --sep:#E2E5EB;
  --ink:#1F2430; --icon:#374151; --muted:#6B7280;
  --accent:#2457D6; --accent-soft:#E3ECFF;
  --shadow:0 8px 30px rgba(15,23,42,.12),0 1px 3px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);overflow:hidden;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}

/* 작업 영역 */
#wrap{position:absolute;inset:0;overflow:auto;padding:84px 96px 104px}
#stage{position:relative;background:#fff;margin:0 auto;border-radius:6px;
  box-shadow:0 2px 6px rgba(15,23,42,.06),0 16px 48px rgba(15,23,42,.12)}
#stage canvas{position:absolute;left:0;top:0;border-radius:6px}
#hl{opacity:.45;mix-blend-mode:multiply;pointer-events:none} /* 형광펜 층: 반투명, 글씨가 비쳐 보임 */
/* 위아래 넘김: 쪽들을 세로로 이어 붙이고, 지금 쓰는 쪽 위에만 필기 판(#stage)을 얹음 */
#pages{display:flex;flex-direction:column;align-items:center;gap:24px;width:max-content;min-width:100%} /* 넓게 확대해도 왼쪽이 잘리지 않게 */
.slot{position:relative;flex:none;background:#fff;border-radius:6px;touch-action:pan-x pan-y;
  box-shadow:0 2px 6px rgba(15,23,42,.06),0 16px 48px rgba(15,23,42,.12)}
.slot>canvas{position:absolute;left:0;top:0;border-radius:6px;pointer-events:none}
.slot>canvas.shl{opacity:.45;mix-blend-mode:multiply}
#wrap.vmode #stage{position:absolute;left:0;top:0;margin:0;background:transparent;box-shadow:none}
#wrap.vmode #stage #bg{visibility:hidden} /* 바탕은 아래 쪽 그림이 보여 줌 */
#ink{touch-action:none;cursor:crosshair}
#ink.laser{cursor:none}
#laser{pointer-events:none} /* 레이저 층: 저장·되돌리기와 상관없이 잠깐 보였다 사라짐 */
#ink.texting{cursor:text}
/* 펜 종류 고르기 */
#penType{height:36px;display:flex;align-items:center;gap:4px;padding:0 10px;margin-right:2px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none}
#penType:hover{background:rgba(15,23,42,.04)}
#penType svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#penMenu{position:fixed;z-index:45;width:250px;padding:6px;display:flex;flex-direction:column;gap:2px;background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#penMenu button{display:flex;align-items:center;gap:12px;height:48px;padding:0 10px;border:none;border-radius:10px;background:transparent;
  font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
#penMenu button:hover{background:rgba(15,23,42,.05)}
#penMenu button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
#penMenu svg{width:44px;height:20px;flex:none}
#penMenu small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
/* 글상자 입력칸: 쓰는 동안만 보이고, 다 쓰면 캔버스에 글씨로 들어감 */
#textEdit{position:absolute;z-index:5;margin:0;padding:0;border:none;white-space:pre;outline:none;
  background:rgba(255,255,255,.55);box-shadow:0 0 0 6px rgba(255,255,255,.55);border-radius:2px;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-weight:400;line-height:1.3;min-width:.6em;caret-color:var(--accent)}
#textEdit b,#textEdit strong{font-weight:700}
/* 쓰는 중인 글상자의 테두리(점선)와 이동 손잡이 */
#textFrame{position:absolute;z-index:4;border:1.5px dashed var(--accent);border-radius:4px;pointer-events:none}
#textHandle{position:absolute;z-index:6;width:30px;height:30px;border:none;border-radius:8px;background:var(--accent);color:#fff;
  display:grid;place-items:center;cursor:move;touch-action:none;box-shadow:0 2px 8px rgba(15,23,42,.25)}
#textHandle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#ink.textmove{cursor:move}
.grp{display:flex;align-items:center;gap:2px;flex:none}
#fsize{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;text-align:center;font:inherit;font-size:14px;font-weight:700;color:var(--ink);outline:none}
#fsize:focus{border-color:var(--accent)}
#boldBtn b{font-size:18px;font-family:Georgia,'Times New Roman',serif}
#boldBtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* PDF 링크: 옅은 점선 상자 + 모서리의 링크 단추 */
#links{position:absolute;inset:0;pointer-events:none}
.lnk{position:absolute;border-radius:3px;background:rgba(36,87,214,.06);outline:1px dashed rgba(36,87,214,.35)}
.lbadge{position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:#2457D6;color:#fff;
  display:grid;place-items:center;cursor:pointer;pointer-events:auto;transform:translate(-40%,-60%);
  box-shadow:0 2px 6px rgba(15,23,42,.25);transition:transform .15s}
.lbadge:hover{transform:translate(-40%,-60%) scale(1.15)}
.lbadge svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* 공통 떠 있는 판 */
.float{position:fixed;left:50%;transform:translateX(-50%);display:flex;align-items:center;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);z-index:30;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

/* 하단 도구 막대 */
#bar{bottom:18px;gap:2px;padding:6px;border-radius:16px;max-width:calc(100vw - 24px);
  overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.ib{width:44px;height:44px;flex:none;border:none;border-radius:10px;background:transparent;
  color:var(--icon);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s}
.ib:hover{background:rgba(15,23,42,.06)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sep{width:1px;height:26px;flex:none;background:var(--sep);margin:0 6px}

/* 색 */
.swatches{display:flex;align-items:center;gap:8px;padding:0 6px;flex:none}
.sw{width:22px;height:22px;flex:none;border:none;border-radius:50%;cursor:pointer;position:relative;
  box-shadow:0 0 0 2px #fff,0 0 0 2px transparent;transition:box-shadow .15s,transform .15s}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.sw.light{outline:1px solid rgba(0,0,0,.12);outline-offset:-1px} /* 노랑처럼 밝은 색 테두리 */
#custom{background:conic-gradient(#E11D48,#F59E0B,#FACC15,#22C55E,#06B6D4,#3B82F6,#8B5CF6,#E11D48)}
#custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0}

.nibbox{width:32px;height:32px;flex:none;display:grid;place-items:center}
#nib{width:4px;border-radius:2px;background:#111827;transition:transform .1s,height .1s,width .1s}
.ctl{display:flex;align-items:center;gap:6px;padding:0 4px;flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
.ctl input{width:70px;accent-color:var(--accent);cursor:pointer}
@media (max-width:1400px){.ctl span{display:none}} /* 화면이 좁으면 글자 이름은 숨기고 슬라이더만 (마우스를 올리면 이름이 보임) */
label.ib input{display:none}

/* 상단 확대·페이지 알약 */
#top{top:16px;gap:4px;padding:6px 10px;border-radius:999px}
#top .ib{width:40px;height:40px;border-radius:50%}
#top .ib svg{width:18px;height:18px;stroke-width:2}
#zoomLbl{font-size:13px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#pg{height:40px;padding:0 12px;border:none;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;
  font:inherit;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
#pg:hover{background:rgba(15,23,42,.06)}
/* 반별 필기 고르기 */
#noteBtn{height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;border:none;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);font:inherit;font-size:14px;font-weight:700;cursor:pointer;max-width:160px}
#noteBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#noteBtn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#notePop{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:45;width:min(320px,92vw);padding:14px;display:flex;flex-direction:column;gap:6px;
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#notePop .ttl{font-size:14px;font-weight:700;padding:0 4px}
#notePop .hint{font-size:12px;color:var(--muted);padding:0 4px 4px;line-height:1.5}
#noteList{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.nchip{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.nchip:hover{background:rgba(15,23,42,.05)}
.nchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.nadd{display:flex;gap:6px}
#noteNew{flex:1;min-width:0;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;outline:none}
#noteNew:focus{border-color:var(--accent)}
#noteAdd{height:38px;padding:0 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.ditem .sub b{color:var(--accent);font-weight:500}
#pgEdit{display:flex;align-items:center;gap:6px;padding:0 6px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
#pgInput{width:64px;height:34px;border:2px solid var(--accent);border-radius:8px;text-align:center;font:inherit;font-weight:700;outline:none;
  -moz-appearance:textfield;appearance:textfield}
#pgInput::-webkit-inner-spin-button,#pgInput::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* 좌우 넘김 */
.side{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.8);color:var(--icon);display:grid;place-items:center;
  box-shadow:0 4px 16px rgba(15,23,42,.10);cursor:pointer;z-index:20;transition:background .15s}
.side:hover{background:#fff}
.side svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#navPrev{left:28px}#navNext{right:28px}

/* 오른쪽 위: 저장 상태 + 구글 계정 */
#acct{position:fixed;top:16px;right:16px;z-index:35;display:flex;align-items:center;gap:6px;padding:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#sync{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:none;border-radius:999px;background:transparent;
  font-size:13px;color:var(--muted);cursor:default;white-space:nowrap}
#sync svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#sync.ok{color:#15803D}
#sync.warn{color:#B45309;background:#FEF3C7;cursor:pointer}
#sync.err{color:#B91C1C;background:#FEE2E2;cursor:pointer}
#sync.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loginBtn{height:36px;display:flex;align-items:center;gap:6px;padding:0 14px;border:none;border-radius:999px;
  background:var(--accent);color:#fff;font-size:13px;font-weight:500;cursor:pointer}
#loginBtn:hover{background:#1A3F9E}
#loginBtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#avatar{width:36px;height:36px;border-radius:50%;border:none;padding:0;background:#E3ECFF;color:var(--accent);
  font-weight:700;font-size:15px;cursor:pointer;overflow:hidden;display:grid;place-items:center}
#avatar img{width:100%;height:100%;object-fit:cover}
#acctMenu{position:fixed;top:68px;right:16px;z-index:36;width:260px;padding:14px;display:none;flex-direction:column;gap:4px;
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#acctMenu.open{display:flex}
#acctMenu .who{padding:2px 6px 10px;border-bottom:1px solid var(--sep);margin-bottom:6px}
#acctMenu .who b{display:block;font-size:14px}
#acctMenu .who span{font-size:12px;color:var(--muted);word-break:break-all}
#acctMenu button{height:40px;text-align:left;padding:0 10px;border:none;border-radius:8px;background:transparent;font-size:14px;color:var(--ink);cursor:pointer}
#acctMenu button:hover{background:rgba(15,23,42,.06)}
#acctMenu .note{font-size:12px;color:var(--muted);padding:6px 10px 0;line-height:1.5}

/* 드라이브 학습지 목록 */
#driveDlg{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.35);display:grid;place-items:center;padding:16px}
#driveDlg[hidden]{display:none}
.dlgBox{width:min(560px,100%);max-height:min(640px,86vh);display:flex;flex-direction:column;background:#fff;
  border-radius:16px;box-shadow:0 24px 64px rgba(15,23,42,.3);overflow:hidden}
.dlgHead{display:flex;align-items:center;gap:8px;padding:14px 14px 10px 20px;border-bottom:1px solid var(--sep)}
.dlgHead b{flex:1;font-size:17px}
#dlgSearch{margin:12px 16px 4px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;outline:none}
#dlgSearch:focus{border-color:var(--accent)}
#dlgList{overflow-y:auto;padding:6px 8px 8px}
.ditem{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:none;border-radius:10px;
  background:transparent;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.ditem:hover{background:rgba(15,23,42,.05)}
.ditem .ic{width:36px;height:36px;flex:none;border-radius:8px;display:grid;place-items:center;background:#FEE2E2;color:#B91C1C}
.ditem .ic.blank{background:#E3ECFF;color:var(--accent)}
.ditem .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ditem .tx{flex:1;min-width:0}
.ditem .nm{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .sub{display:block;font-size:12px;color:var(--muted)}
.ditem .badge{flex:none;font-size:11px;font-weight:500;color:#15803D;background:#DCFCE7;border-radius:999px;padding:3px 8px}
.ditem.cur{background:var(--accent-soft)}
.dmsg{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.dfoot{padding:10px 20px 14px;border-top:1px solid var(--sep);font-size:12px;color:var(--muted);line-height:1.5}

#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:rgba(31,36,48,.85);color:#fff;
  padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}

/* 좁은 화면(세로 태블릿 등) */
@media (max-width:900px){
  #wrap{padding:76px 12px 96px}
  .side{display:none}
  .ctl span{display:none}
  #sync span{display:none}
  #loginBtn span{display:none}
  #acct{top:auto;bottom:86px;right:12px}
  #acctMenu{top:auto;bottom:140px;right:12px}
}
</style>
</head>
<body>

<div id="wrap"><div id="pages" hidden></div><div id="stage"><canvas id="bg"></canvas><canvas id="hl"></canvas><canvas id="ink"></canvas><canvas id="laser"></canvas><div id="links"></div><div id="textFrame" hidden></div><div id="textEdit" hidden contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="글상자 내용"></div><button id="textHandle" type="button" hidden title="끌어서 글상자 옮기기" aria-label="글상자 옮기기"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button></div></div>

<!-- 상단: 확대·축소 + 페이지 -->
<div id="top" class="float">
  <button class="ib" id="zoomOut" title="축소 ( - )" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <span id="zoomLbl">100%</span>
  <button class="ib" id="zoomIn" title="확대 ( + )" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="zoomFit" title="화면 맞춤 ( 0 )" aria-label="화면 맞춤"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  <button class="ib" id="modeBtn" title="넘김 방식 바꾸기" aria-label="넘김 방식 바꾸기"><svg viewBox="0 0 24 24"></svg></button>
  <div class="sep"></div>
  <button id="pg" type="button" title="눌러서 쪽 번호로 바로 가기 ( G )" aria-label="쪽 번호로 바로 가기">1 / 1</button>
  <span id="pgEdit" hidden><input id="pgInput" type="number" inputmode="numeric" min="1" aria-label="이동할 쪽 번호"><span>/ <span id="pgTotal">1</span></span></span>
  <div class="sep"></div>
  <button id="noteBtn" type="button" title="반마다 따로 필기하기" aria-haspopup="true"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2Z"/><path d="M4 19V5M8 7h7"/></svg><span id="noteName">기본</span></button>
</div>

<!-- 하단: 도구 막대 -->
<div id="bar" class="float" role="toolbar" aria-label="필기 도구">
  <button class="ib on" id="pen" title="펜 ( P )" aria-label="펜"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  <button class="ib" id="marker" title="형광펜 ( H )" aria-label="형광펜"><svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/><path d="M14 20h7"/></svg></button>
  <button class="ib" id="laserBtn" title="레이저 펜 ( L ) — 쓰고 나면 잠시 뒤 사라져요" aria-label="레이저 펜"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  <button class="ib" id="textBtn" title="글상자 ( T ) — 누른 자리에 글씨를 넣어요" aria-label="글상자"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/></svg></button>

<script>
/* ==========================================================
   구글 클라이언트 ID — 구글 클라우드 콘솔에서 받은 값을 따옴표 안에 붙여 넣으세요.
   예: '1234567890-abcdefg.apps.googleusercontent.com'
   비워 두면 로그인 없이 '이 기기에 저장'만 동작해요.
   ========================================================== */
const GOOGLE_CLIENT_ID='909929859550-gsn5q7vaq7c1dq0nls3rk29tkj866apt.apps.googleusercontent.com';

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const bg=$('bg'),hl=$('hl'),ink=$('ink'),laser=$('laser'),stage=$('stage'),wrap=$('wrap');
const bctx=bg.getContext('2d'),lctx=laser.getContext('2d');
let hctx=hl.getContext('2d'),ctx=ink.getContext('2d'); // 다른 쪽 그림을 그릴 때 잠깐 바꿔 씀
const MIN_ZOOM=0.5,MAX_ZOOM=4;
const MARKER_SCALE=2.5; // 형광펜은 펜보다 굵게
let pdf=null,page=0,pageCount=1,strokes=[[]],tool='pen',cur=null;
let penColor='#111827',markerColor='#FACC15',textColor='#111827'; // 펜·형광펜·글상자는 색을 따로 기억
let textSize=32,textBold=false; // 글상자 기본 크기·굵기
let W=0,H=0,zoom=1,blankRatio=null,renderTask=null,renderId=0;
let pmap=[]; // 화면의 쪽 → PDF 쪽 번호(1부터). 0이면 중간에 끼워 넣은 빈 페이지
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const curColor=()=>tool==='marker'?markerColor:tool==='text'?textColor:penColor;

/* ---------- 화면 그리기 ---------- */
function innerSize(){
  const cs=getComputedStyle(wrap);
  return {
    w:wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),
    h:wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)
  };
}
async function renderPage(){
  const myId=++renderId;
  const inner=innerSize(),baseW=Math.max(200,inner.w);
  if(blankRatio===null)blankRatio=Math.max(0.6,inner.h/baseW);
  let v0=null,p=null;
  if(pdf){await ensureRatios();if(myId!==renderId)return;}
  const pn=pdf?pmap[page]||0:0; // 0: 빈 페이지
  if(pn){p=await pdf.getPage(pn);if(myId!==renderId)return;v0=p.getViewport({scale:1});}
  W=baseW*zoom;
  H=p?v0.height*(W/v0.width):W*ratioOf(page);
  let rebuilt=false;
  if(vmode){
    await ensureRatios();if(myId!==renderId)return;
    rebuilt=layoutSlots();attachStage();
  }
  // 캔버스가 너무 커지지 않게 해상도 제한 (태블릿 메모리 보호)
  const dpr=window.devicePixelRatio||1;
  const pr=Math.min(dpr,Math.sqrt(16e6/(W*H)));
  setSize(pr);
  if(p){
    if(renderTask){try{renderTask.cancel();}catch(_){}}
    renderTask=p.render({canvasContext:bctx,viewport:p.getViewport({scale:(W/v0.width)*pr})});
    try{await renderTask.promise;}catch(_){return;}
  }else{
    bctx.fillStyle='#fff';bctx.fillRect(0,0,bg.width,bg.height);
  }
  if(myId!==renderId)return;
  if(p){await loadLinks(p,v0);if(myId!==renderId)return;}
  else{pageLinks=[];}
  renderLinks();
  if(editing)styleEditor();
  $('pg').textContent=(page+1)+' / '+pageCount;
  updatePageBtns();
  $('zoomLbl').textContent=Math.round(zoom*100)+'%';
  redraw();
  if(rebuilt)scrollToSlot(page);
}
function setSize(pr){
  stage.style.width=W+'px';stage.style.height=H+'px';
  for(const c of [bg,hl,ink,laser]){c.width=Math.round(W*pr);c.height=Math.round(H*pr);c.style.width=W+'px';c.style.height=H+'px';}
  ctx.setTransform(pr,0,0,pr,0,0);
  hctx.setTransform(pr,0,0,pr,0,0);
  lctx.setTransform(pr,0,0,pr,0,0);
}

/* ---------- 레이저 펜: 빛나는 빨간 선, 펜을 떼면 잠시 뒤 서서히 사라짐 ---------- */
const LASER_HOLD=800,LASER_FADE=600; // 펜을 뗀 뒤 그대로 보이는 시간, 사라지는 시간 (ms)
let laserStrokes=[],hoverPt=null,laserRAF=0;
const laserScale=()=>Math.max(0.3,(+$('size').value||10)/10); // 굵기 슬라이더 10 = 기본 굵기
function kickLaser(){if(!laserRAF)laserRAF=requestAnimationFrame(drawLaser);}
function laserPath(pts){
  lctx.beginPath();lctx.moveTo(pts[0].x*W,pts[0].y*W);
  if(pts.length===1)lctx.lineTo(pts[0].x*W+0.1,pts[0].y*W);
  for(let i=1;i<pts.length;i++)lctx.lineTo(pts[i].x*W,pts[i].y*W);
}
function drawLaser(){
  laserRAF=0;
  const now=performance.now();
  lctx.clearRect(0,0,W,H);
  laserStrokes=laserStrokes.filter(s=>!s.end||now-s.end<LASER_HOLD+LASER_FADE);
  lctx.lineCap='round';lctx.lineJoin='round';
  for(const s of laserStrokes){
    lctx.globalAlpha=s.end?Math.max(0,Math.min(1,1-(now-s.end-LASER_HOLD)/LASER_FADE)):1;
    laserPath(s.pts);
    const k=s.w||1; // 그을 때의 굵기
    lctx.shadowColor='rgba(255,30,30,.9)';lctx.shadowBlur=14*Math.sqrt(k);
    lctx.strokeStyle='rgba(255,45,45,.9)';lctx.lineWidth=6*k;lctx.stroke();
    lctx.shadowBlur=0;lctx.strokeStyle='rgba(255,236,236,.95)';lctx.lineWidth=2*k;lctx.stroke();
  }
  lctx.globalAlpha=1;
  if(hoverPt&&tool==='laser'){ // 펜을 띄우고 있을 때도 빨간 점이 따라다님
    const x=hoverPt.x*W,y=hoverPt.y*W;
    const k=laserScale();
    lctx.shadowColor='rgba(255,30,30,.9)';lctx.shadowBlur=16*Math.sqrt(k);
    lctx.fillStyle='#FF2D2D';lctx.beginPath();lctx.arc(x,y,Math.max(6*k,3),0,Math.PI*2);lctx.fill();
    lctx.shadowBlur=0;lctx.fillStyle='#FFECEC';lctx.beginPath();lctx.arc(x,y,Math.max(2.2*k,1.2),0,Math.PI*2);lctx.fill();
  }
  if(laserStrokes.length)kickLaser();
}
function clearLaser(){laserStrokes=[];kickLaser();}

/* ---------- PDF 링크 ---------- */
// 웹 주소 링크는 새 탭으로, 같은 PDF 안의 다른 쪽으로 가는 링크는 그 쪽으로 넘어감
// 펜으로는 필기만 하고, 링크는 ① 모서리의 파란 단추 ② 손가락으로 톡 ③ Ctrl+클릭 으로 열림
let pageLinks=[];
const LINK_ICON='<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';
async function loadLinks(p,v0){
  pageLinks=[];
  try{
    const vp=p.getViewport({scale:W/v0.width});
    const anns=await p.getAnnotations({intent:'display'});
    for(const a of anns){
      if(a.subtype!=='Link')continue;
      const url=a.url||a.unsafeUrl||null;
      const safeUrl=url&&/^(https?:|mailto:)/i.test(url)?url:null;
      if(!safeUrl&&!a.dest)continue;
      const r=vp.convertToViewportRectangle(a.rect);
      pageLinks.push({
        x0:Math.min(r[0],r[2])/W,y0:Math.min(r[1],r[3])/W,
        x1:Math.max(r[0],r[2])/W,y1:Math.max(r[1],r[3])/W,
        url:safeUrl,dest:safeUrl?null:a.dest
      });
    }
  }catch(_){pageLinks=[];}
}
function renderLinks(){
  const box=$('links');box.textContent='';
  for(const l of pageLinks){
    const d=document.createElement('div');d.className='lnk';
    d.style.left=l.x0*W+'px';d.style.top=l.y0*W+'px';
    d.style.width=(l.x1-l.x0)*W+'px';d.style.height=(l.y1-l.y0)*W+'px';
    const b=document.createElement('button');b.className='lbadge';b.innerHTML=LINK_ICON;
    b.style.left=l.x1*W+'px';b.style.top=l.y0*W+'px';
    const label=l.url?('링크 열기: '+l.url):'연결된 쪽으로 이동';
    b.title=label;b.setAttribute('aria-label',label);
    b.addEventListener('pointerdown',e=>e.stopPropagation());
    b.onclick=()=>openLink(l);
    box.appendChild(d);box.appendChild(b);
  }
}
async function openLink(l){
  if(l.url){window.open(l.url,'_blank','noopener');return;}
  try{
    let d=l.dest;
    if(typeof d==='string')d=await pdf.getDestination(d);
    if(!Array.isArray(d))return;
    const ref=d[0];
    const idx=typeof ref==='number'?ref:await pdf.getPageIndex(ref);
    const at=pmap.indexOf(idx+1); // 빈 페이지를 끼웠으면 화면 쪽 번호가 달라짐
    if(at>=0)goPage(at);
  }catch(_){toast('이동할 쪽을 찾지 못했어요');}
}
function linkAt(cx,cy){
  const r=ink.getBoundingClientRect(),x=(cx-r.left)/W,y=(cy-r.top)/W;
  return pageLinks.find(l=>x>=l.x0&&x<=l.x1&&y>=l.y0&&y<=l.y1)||null;
}

/* ---------- 캘리그래피 펜 / 형광펜 ---------- */
// 납작한 펜촉을 흉내: 펜촉 각도 방향으로 폭을 가진 띠를 이어 그려서 획 방향에 따라 굵기가 달라짐
// 형광펜은 별도 층에 진하게 그리고, 층 전체를 반투명으로 보여줘서 겹쳐도 얼룩지지 않음
function drawSeg(s,a,b){
  const c=s.marker?hctx:ctx;
  if(s.pt==='ball'||s.pt==='brush'){ // 둥근 펜: 볼펜(고른 굵기) / 붓펜(필압에 따라 크게 변함)
    const k=s.size*W/1000,f=p=>s.pt==='brush'?(0.12+p*1.5):(0.42+p*0.16);
    c.strokeStyle=s.color;c.lineCap='round';c.lineJoin='round';c.lineWidth=k*(f(a.p)+f(b.p))/2;
    c.beginPath();c.moveTo(a.x*W,a.y*W);c.lineTo(b.x*W,b.y*W);c.stroke();
    return;
  }
  const ang=s.angle*Math.PI/180,nx=Math.cos(ang),ny=Math.sin(ang);
  const pa=s.marker?1:(0.3+a.p*0.9),pb=s.marker?1:(0.3+b.p*0.9);
  const wa=s.size*W/1000*pa,wb=s.size*W/1000*pb;
  const ax=a.x*W,ay=a.y*W,bx=b.x*W,by=b.y*W;
  c.fillStyle=s.color;c.beginPath();
  c.moveTo(ax+nx*wa,ay+ny*wa);c.lineTo(bx+nx*wb,by+ny*wb);
  c.lineTo(bx-nx*wb,by-ny*wb);c.lineTo(ax-nx*wa,ay-ny*wa);
  c.closePath();c.fill();
}
function drawStroke(s){
  if(s.type==='text'){drawText(s);return;}
  const pts=s.pts;
  if(pts.length===1){drawSeg(s,pts[0],{...pts[0],x:pts[0].x+0.0005});return;}
  for(let i=1;i<pts.length;i++)drawSeg(s,pts[i-1],pts[i]);
}
function redraw(){
  ctx.clearRect(0,0,W,H);hctx.clearRect(0,0,W,H);
  for(const s of strokes[page])drawStroke(s);
}
function pos(e){
  const r=ink.getBoundingClientRect();let p=e.pressure;
  if(e.pointerType==='mouse'||!p)p=0.5;
  return {x:(e.clientX-r.left)/W,y:(e.clientY-r.top)/W,p};
}
function eraseAt(p){
  const r=0.012/zoom,before=strokes[page].length;
  strokes[page]=strokes[page].filter(s=>s.type==='text'
    ?!(s._bb&&p.x>=s._bb.x0-r&&p.x<=s._bb.x1+r&&p.y>=s._bb.y0-r&&p.y<=s._bb.y1+r) // 글상자는 글씨 영역을 문지르면 지워짐
    :!s.pts.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<r));
  if(strokes[page].length!==before){redraw();return true;}
  return false;
}
// 펜촉 미리보기: 도구·굵기·각도·색이 바뀌면 같이 바뀜
function updateNib(){
  const nib=$('nib'),size=+$('size').value;
  const marker=tool==='marker';
  if(tool==='laser'){ // 레이저일 땐 빨간 점으로 표시
    nib.style.width=nib.style.height=Math.min(26,Math.max(4,10*laserScale()))+'px';nib.style.borderRadius='50%';
    nib.style.transform='none';nib.style.background='#FF2D2D';nib.style.opacity=1;
    nib.style.boxShadow='0 0 8px rgba(255,30,30,.8)';return;
  }
  nib.style.boxShadow='none';
  if(tool==='pen'&&penType!=='cal'){ // 둥근 펜은 동그라미로
    const d=Math.min(26,penType==='brush'?6+size*0.7:3+size*0.45);
    nib.style.width=nib.style.height=d+'px';nib.style.borderRadius='50%';nib.style.transform='none';
    nib.style.background=curColor();nib.style.opacity=1;return;
  }
  nib.style.borderRadius='2px';
  nib.style.height=Math.min(30,(8+size*0.75)*(marker?1.5:1))+'px';
  nib.style.width=(marker?6:4)+'px';
  nib.style.transform='rotate('+((+$('angle').value)-90)+'deg)';
  nib.style.background=curColor();
  nib.style.opacity=marker?.55:1;
}
// 지금 도구의 색에 맞는 색 동그라미 표시
function syncSwatches(){
  const c=curColor().toLowerCase();let found=false;
  document.querySelectorAll('.sw[data-c]').forEach(el=>{
    const on=el.dataset.c.toLowerCase()===c;el.classList.toggle('on',on);if(on)found=true;
  });
  $('custom').classList.toggle('on',!found);
  if(!found){$('custom').style.background=c;}
}
function setColor(c){
  if(tool==='marker')markerColor=c;
  else if(tool==='text'){textColor=c;colorSelection(c);}
  else{penColor=c;if(tool==='eraser'||tool==='laser')setTool('pen');}
  syncSwatches();updateNib();
}

/* ---------- 확대·축소 (미리보기 후 고해상도로 다시 그림) ---------- */
let zs=null,zsTimer=null;
function zoomPreview(newZoom,cx,cy){
  newZoom=clamp(newZoom,MIN_ZOOM,MAX_ZOOM);
  if(!zs){
    const el=zoomEl(),r=el.getBoundingClientRect();
    zs={el,ox:cx-r.left,oy:cy-r.top,cx,cy,startZoom:zoom,target:zoom,dx:0,dy:0};
    el.style.transformOrigin=zs.ox+'px '+zs.oy+'px';
  }
  zs.target=newZoom;
  const s=newZoom/zs.startZoom;
  zs.el.style.transform=`translate(${zs.dx}px,${zs.dy}px) scale(${s})`;
  $('zoomLbl').textContent=Math.round(newZoom*100)+'%';
}
async function zoomCommit(){
  if(!zs)return;
  const z=zs,oldW=W;
  zs=null;
  const fx=z.ox/oldW,fy=z.oy/oldW;
  const anchorX=z.cx+z.dx,anchorY=z.cy+z.dy;
  z.el.style.transform='';
  zoom=z.target;
  await renderPage();
  const r=zoomEl().getBoundingClientRect();
  wrap.scrollLeft+=r.left+fx*W-anchorX;
  wrap.scrollTop+=r.top+fy*W-anchorY;
}
const zoomEl=()=>vmode?$('pages'):stage; // 위아래 방식에선 쪽 묶음 전체를 확대
function zoomTo(newZoom){
  const r=wrap.getBoundingClientRect();
  zoomPreview(newZoom,r.left+r.width/2,r.top+r.height/2);
  zoomCommit();
}
wrap.addEventListener('wheel',e=>{
  if(!e.ctrlKey)return;
  e.preventDefault();
  const base=zs?zs.target:zoom;
  zoomPreview(base*Math.exp(-e.deltaY*0.002),e.clientX,e.clientY);
  clearTimeout(zsTimer);zsTimer=setTimeout(zoomCommit,180);
},{passive:false});

/* ---------- 페이지 이동 ---------- */
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.opacity=0,900);}
async function goPage(n){
  if(n<0||n>=pageCount){toast(n<0?'첫 페이지예요':'마지막 페이지예요');return;}
  commitText();
  if(vmode){ // 위아래 방식: 그 쪽으로 스크롤
    if(!slots[n])await renderPage();
    scrollToSlot(n);activate(n);toast((n+1)+' / '+pageCount);return;
  }
  page=n;laserStrokes=[];await renderPage();wrap.scrollTop=0;wrap.scrollLeft=0;toast((page+1)+' / '+pageCount);
  if(hasInk())markDirty(); // 반마다 보던 쪽도 기억
}

/* ---------- 입력: 펜·마우스=필기 / 손가락=넘기기·이동·확대 ---------- */
const touches=new Map();let gesture=null;
ink.addEventListener('pointerdown',e=>inkDown(e));
function inkDown(e){
  if(e.pointerType==='touch'){
    if(cur)return; // 펜으로 쓰는 중엔 손바닥 터치 무시
    ink.setPointerCapture(e.pointerId);
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    startGesture();return;
  }
  if(e.ctrlKey){const l=linkAt(e.clientX,e.clientY);if(l){openLink(l);return;}} // Ctrl+클릭으로 링크 열기
  ink.setPointerCapture(e.pointerId);
  if(tool==='text'&&e.button!==5){textDown(pos(e));return;}
  if(tool==='laser'&&e.button!==5){
    const p=pos(e);cur={laser:true,s:{pts:[p],end:null,w:laserScale()}};laserStrokes.push(cur.s);hoverPt=p;kickLaser();return;
  }
  if(tool==='eraser'||e.button===5){cur={erase:true,changed:eraseAt(pos(e))};return;} // 펜 뒤쪽 지우개도 인식
  const marker=tool==='marker',size=+$('size').value;
  cur={color:curColor(),size:marker?size*MARKER_SCALE:size,angle:+$('angle').value,marker,pts:[pos(e)]};
  if(!marker&&penType!=='cal')cur.pt=penType; // 볼펜·붓펜
  strokes[page].push(cur);drawStroke(cur);
}
ink.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){
    if(!touches.has(e.pointerId))return;
    touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    moveGesture();return;
  }
  if(tool==='laser'){hoverPt=pos(e);kickLaser();}
  if(!cur)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs){
    const p=pos(ev);
    if(cur.textDrag){textMove(p);break;}
    if(cur.laser){cur.s.pts.push(p);continue;}
    if(cur.erase){if(eraseAt(p))cur.changed=true;continue;}
    const last=cur.pts[cur.pts.length-1];
    p.p=last.p*0.6+p.p*0.4; // 필압 부드럽게
    cur.pts.push(p);drawSeg(cur,last,p);
  }
});
function endPointer(e){
  if(e.pointerType==='touch'){
    if(!touches.has(e.pointerId))return;
    touches.delete(e.pointerId);endGesture();return;
  }
  if(cur&&cur.textDrag){const c=cur;cur=null;textUp(c);return;}
  if(cur&&cur.laser){cur.s.end=performance.now();kickLaser();}
  else if(cur&&(!cur.erase||cur.changed))markDirty(); // 한 획 끝날 때마다 자동 저장 예약
  cur=null;
}
ink.addEventListener('pointerup',endPointer);
ink.addEventListener('pointercancel',endPointer);
ink.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'){hoverPt=null;kickLaser();}});

function startGesture(){
  const pts=[...touches.values()];
  if(pts.length===1){
    gesture={type:'pan',sx:pts[0].x,sy:pts[0].y,lx:pts[0].x,ly:pts[0].y,t:Date.now()};
  }else if(pts.length===2){
    const [a,b]=pts;
    gesture={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),mx0:(a.x+b.x)/2,my0:(a.y+b.y)/2};
    zs=null;zoomPreview(zoom,gesture.mx0,gesture.my0);
  }
}
function moveGesture(){
  if(!gesture)return;
  const pts=[...touches.values()];
  if(gesture.type==='pan'&&pts.length===1){
    const p=pts[0];
    wrap.scrollLeft-=p.x-gesture.lx;wrap.scrollTop-=p.y-gesture.ly;
    gesture.lx=p.x;gesture.ly=p.y;
  }else if(gesture.type==='pinch'&&pts.length>=2){
    const [a,b]=pts,d=Math.hypot(a.x-b.x,a.y-b.y);
    if(zs){zs.dx=(a.x+b.x)/2-gesture.mx0;zs.dy=(a.y+b.y)/2-gesture.my0;}
    zoomPreview(zoom*d/gesture.d0,gesture.mx0,gesture.my0);
  }
}
function endGesture(){
  if(!gesture)return;
  if(gesture.type==='pinch'){
    if(touches.size<2){zoomCommit();gesture={type:'done'};}
  }else if(gesture.type==='pan'&&touches.size===0){
    const dx=gesture.lx-gesture.sx,dy=gesture.ly-gesture.sy,dt=Date.now()-gesture.t;
    const overflowX=wrap.scrollWidth>wrap.clientWidth+2;
    // 손가락으로 톡 누르면 그 자리의 링크 열기
    if(Math.abs(dx)<10&&Math.abs(dy)<10&&dt<350){
      if(tool==='text'){ // 글상자 도구일 땐 손가락으로 톡 → 그 자리에 글상자
        const r=ink.getBoundingClientRect(),p={x:(gesture.lx-r.left)/W,y:(gesture.ly-r.top)/W};
        if(editing)commitText();else{const hit=textAt(p);hit?editText(hit):newText(p);}
      }else{const l=linkAt(gesture.lx,gesture.ly);if(l)openLink(l);}
    }
    // 가로로 넘칠 만큼 확대된 상태가 아니면, 옆으로 쓸어서 페이지 넘김
    else if(!vmode&&!overflowX&&Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.5&&dt<800){
      goPage(page+(dx<0?1:-1));
    }
  }
  if(touches.size===0)gesture=null;
}

/* ---------- 버튼 ---------- */
function setTool(t){
  if(t!=='text')commitText();
  tool=t;
  ['pen','marker','eraser'].forEach(id=>$(id).classList.toggle('on',id===t));
  $('textBtn').classList.toggle('on',t==='text');
  ink.classList.toggle('texting',t==='text');
  $('penCtl').hidden=t==='text';$('textCtl').hidden=t!=='text';
  $('penType').hidden=t!=='pen';$('penMenu').hidden=true;
  $('angleCtl').hidden=(t==='pen'&&penType!=='cal')||t==='laser'; // 둥근 펜·레이저는 펜촉각이 필요 없음
  $('laserBtn').classList.toggle('on',t==='laser');
  ink.classList.toggle('laser',t==='laser');
  if(t!=='laser'){hoverPt=null;kickLaser();}
  syncSwatches();updateNib();
}
$('pen').onclick=()=>{if(tool==='pen')openPenMenu();else setTool('pen');}; // 펜을 한 번 더 누르면 펜 종류 고르기
/* 펜 종류: 캘리그래피(기본) / 볼펜 / 붓펜 */
let penType='cal';
const PEN_NAMES={cal:'캘리그래피',ball:'볼펜',brush:'붓펜'};
function setPenType(t){
  penType=PEN_NAMES[t]?t:'cal';
  try{localStorage.setItem('pen:penType',penType);}catch(_){}
  $('penTypeName').textContent=PEN_NAMES[penType];
  document.querySelectorAll('#penMenu [data-pt]').forEach(b=>b.classList.toggle('on',b.dataset.pt===penType));
  if(tool!=='pen')setTool('pen');else{$('angleCtl').hidden=penType!=='cal';updateNib();}
}
function openPenMenu(){
  const m=$('penMenu');
  if(!m.hidden){m.hidden=true;return;}
  if(tool!=='pen')setTool('pen');
  m.hidden=false;
  const r=$('penType').getBoundingClientRect(),mh=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(innerWidth-258,r.left))+'px';
  m.style.top=Math.max(8,r.top-mh-10)+'px';
}
$('penType').onclick=e=>{e.stopPropagation();openPenMenu();};
document.querySelectorAll('#penMenu [data-pt]').forEach(b=>b.onclick=()=>{setPenType(b.dataset.pt);$('penMenu').hidden=true;});
document.addEventListener('click',e=>{if(!e.target.closest('#penMenu,#penType,#pen'))$('penMenu').hidden=true;});
$('laserBtn').onclick=()=>setTool('laser');
$('textBtn').onclick=()=>setTool('text');
$('marker').onclick=()=>setTool('marker');
$('eraser').onclick=()=>setTool('eraser');
document.querySelectorAll('.sw[data-c]').forEach(el=>el.onclick=()=>setColor(el.dataset.c));
$('customInput').addEventListener('input',e=>setColor(e.target.value));
$('size').oninput=()=>{updateNib();if(tool==='laser')kickLaser();}; // 레이저 점 크기도 바로 바뀜
$('angle').oninput=updateNib;
$('undo').onclick=()=>{commitText();if(strokes[page].pop()){redraw();markDirty();}};
$('clear').onclick=()=>{commitText();if(confirm('이 페이지 필기를 모두 지울까요?')){strokes[page]=[];redraw();markDirty();}};
$('navPrev').onclick=()=>goPage(page-1);
$('navNext').onclick=()=>goPage(page+1);
$('zoomIn').onclick=()=>zoomTo(zoom*1.25);
$('zoomOut').onclick=()=>zoomTo(zoom/1.25);
$('zoomFit').onclick=()=>zoomTo(1);
// 빈 페이지: 지금 쪽 바로 뒤에 끼워 넣음 (PDF 원본은 그대로, 반별 필기에 함께 저장)
$('addpg').onclick=async()=>{
  commitText();
  const at=page+1;
  if(pdf)pmap.splice(at,0,0);
  strokes.splice(at,0,[]);pageCount++;
  markDirty();
  if(vmode)await renderPage(); // 쪽 배치를 새로 깔고
  goPage(at);
  toast((at+1)+'쪽에 빈 페이지를 넣었어요');
};
$('delpg').onclick=async()=>{
  if(!canDelPage())return;
  commitText();
  if(strokes[page].length&&!confirm('이 빈 페이지와 그 위의 필기를 지울까요?'))return;
  const at=page;
  if(pdf)pmap.splice(at,1);
  strokes.splice(at,1);pageCount--;
  page=Math.min(at,pageCount-1);
  if(vmode){slotsSig='';await renderPage();scrollToSlot(page);}
  else{await renderPage();wrap.scrollTop=0;}
  markDirty();toast('빈 페이지를 뺐어요');
};
function canDelPage(){return pdf?pmap[page]===0:pageCount>1;} // PDF 쪽은 못 지우고, 끼워 넣은 빈 페이지만
function updatePageBtns(){$('delpg').hidden=!canDelPage();}
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  e.target.value='';
  let buf;
  try{buf=await f.arrayBuffer();}catch(_){toast('PDF를 열 수 없어요');return;}
  await openPdfBuffer(buf,f.name,f.size);
};
// PDF 내용(바이트)으로 학습지를 엶 — 기기에서 고른 파일, 드라이브에서 고른 파일 모두 여기로
let curPdfBytes=null; // 드라이브 보관용으로 지금 학습지 PDF를 들고 있음
async function openPdfBuffer(buf,name,size){
  let newPdf,key;
  try{
    key=await docKeyOf(buf,{name,size:size||buf.byteLength}); // 같은 PDF면 어느 기기에서 열어도 같은 열쇠 → 필기를 찾아 불러옴
    newPdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise; // 복사본을 넘김(원본은 보관용)
  }catch(_){toast('PDF를 열 수 없어요');return false;}
  await flushSave(); // 앞에서 쓰던 학습지 필기 먼저 저장
  pdf=newPdf;curPdfBytes=new Uint8Array(buf);
  pageCount=pdf.numPages;page=0;zoom=1;strokes=Array.from({length:pageCount},()=>[]);
  pmap=Array.from({length:pageCount},(_,i)=>i+1);
  baseKey=key;noteLabel=lastLabelOf(key);
  await openDoc(noteKeyOf(baseKey,noteLabel),name);
  await renderPage();if(!vmode)wrap.scrollTop=0;
  toast(noteLabel?name+' · '+noteLabel:name);
  archivePdf(); // 로그인돼 있으면 PDF도 드라이브에 보관
  return true;
}
async function openBlank(){
  await flushSave();
  pdf=null;curPdfBytes=null;pageCount=1;page=0;zoom=1;strokes=[[]];
  baseKey='blank';noteLabel=lastLabelOf('blank');
  await openDoc(noteKeyOf(baseKey,noteLabel),'빈 노트');
  await renderPage();if(!vmode)wrap.scrollTop=0;
  toast(noteLabel?'빈 노트 · '+noteLabel:'빈 노트');
}
$('save').onclick=()=>{
  const c=document.createElement('canvas');c.width=bg.width;c.height=bg.height;
  const x=c.getContext('2d');
  x.drawImage(bg,0,0);
  x.globalAlpha=.45;x.globalCompositeOperation='multiply';x.drawImage(hl,0,0); // 화면과 똑같이 형광펜 합치기
  x.globalAlpha=1;x.globalCompositeOperation='source-over';x.drawImage(ink,0,0);
  const a=document.createElement('a');a.download='판서_'+(page+1)+'쪽.png';a.href=c.toDataURL();a.click();
};

/* ---------- 키보드 (발표용 리모컨의 PageUp/PageDown도 인식) ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return; // 글상자에 쓰는 중엔 단축키 끔
  if(e.ctrlKey&&e.key==='z'){$('undo').click();e.preventDefault();return;}
  if(e.ctrlKey)return;
  if(e.target.tagName==='INPUT'&&e.target.type==='range'&&e.key.startsWith('Arrow'))return; // 슬라이더 조작 중엔 넘기지 않음
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return; // 글자 입력 중엔 단축키 끔
  if(!$('driveDlg').hidden)return; // 목록 창이 떠 있을 땐 단축키 끔
  switch(e.key){
    case 'p':setTool('pen');break;
    case 'h':setTool('marker');break;
    case 't':setTool('text');e.preventDefault();break;
    case 'l':setTool('laser');break;
    case 'g':openPgEdit();e.preventDefault();break;
    case 'e':setTool('eraser');break;
    case 'ArrowRight':case 'PageDown':goPage(page+1);e.preventDefault();break;
    case 'ArrowLeft':case 'PageUp':goPage(page-1);e.preventDefault();break;
    case '+':case '=':zoomTo(zoom*1.25);break;
    case '-':zoomTo(zoom/1.25);break;
    case '0':zoomTo(1);break;

window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderPage,150);});

/* ==========================================================
   저장·불러오기
   - 항상: 이 기기(브라우저)에 자동 저장 → 로그인 안 해도 같은 기기에서 이어 쓰기
   - 로그인하면: 내 구글 드라이브 '판서 그림판' 폴더에도 자동 저장 → 다른 기기에서 이어 쓰기
   - 드라이브 권한은 drive.file: 이 그림판이 만든 파일만 보고 고칠 수 있음
   ========================================================== */
const DRIVE='https://www.googleapis.com/drive/v3',UPLOAD='https://www.googleapis.com/upload/drive/v3';
const SCOPE='https://www.googleapis.com/auth/drive.file';
const LS_HINT='pen:loginHint',LS_DOC='pen:doc:',LS_TOK='pen:token';
let baseKey='blank',noteLabel=''; // 학습지(PDF) 열쇠, 반 이름 — 필기 열쇠 = 학습지 열쇠 + '#반이름'
let docKey=null,docName='',docUpdated=0,driveDirty=false,saveTimer=null,saveChain=Promise.resolve();
let tokenClient=null,accessToken=null,tokenExp=0,user=null,folderId=null,driveIds={},lsWarned=false;
const lsGet=k=>{try{return localStorage.getItem(k);}catch(_){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(_){return false;}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(_){}};
const r4=v=>Math.round(v*1e4)/1e4,r2=v=>Math.round(v*100)/100;

async function docKeyOf(buf,f){
  try{
    const h=new Uint8Array(await crypto.subtle.digest('SHA-256',buf));
    return 'pdf-'+[...h.slice(0,12)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(_){ // 아주 오래된 브라우저용 예비 열쇠
    return 'pdf-'+(f.name+'-'+f.size).replace(/[^A-Za-z0-9]/g,'').slice(0,40);
  }
}
function hasInk(){return strokes.some(pg=>pg.length);}
function serialize(){
  return {v:1,app:'pen',key:docKey,base:baseKey,label:noteLabel,name:docName,pageCount,pg:page,updated:docUpdated,
    pm:pdf&&pmap.includes(0)?pmap.slice():undefined, // 끼워 넣은 빈 페이지 위치
    pages:strokes.map(pg=>pg.map(s=>s.type==='text'
      ?{t:'x',x:r4(s.x),y:r4(s.y),r:s.runs.map(r=>r.c?[r.t,r.b?1:0,r.c]:[r.t,r.b?1:0]),fs:s.fs,c:s.color}
      :{c:s.color,s:r2(s.size),a:s.angle,m:s.marker?1:0,k:s.pt||undefined,p:s.pts.map(q=>[r4(q.x),r4(q.y),r2(q.p)])}))};
}
function applyData(d){
  const pages=(d.pages||[]).map(pg=>pg.map(s=>s.t==='x'
    ?{type:'text',x:s.x,y:s.y,fs:s.fs||32,color:s.c,
      runs:s.r?s.r.map(r=>({t:r[0],b:!!r[1],c:r[2]||null})):[{t:s.tx||'',b:!!s.b,c:null}]} // 예전 형식(전체 굵기)도 읽음
    :{color:s.c,size:s.s,angle:s.a,marker:!!s.m,pt:s.k||null,pts:s.p.map(q=>({x:q[0],y:q[1],p:q[2]}))}));
  if(pdf){ // PDF 쪽수에 맞춤
    const n=pdf.numPages;
    pmap=Array.isArray(d.pm)&&d.pm.length&&d.pm.every(v=>Number.isInteger(v)&&v>=0&&v<=n)?d.pm.slice():Array.from({length:n},(_,i)=>i+1);
    pageCount=pmap.length;
    strokes=Array.from({length:pageCount},(_,i)=>pages[i]||[]);
  }else{
    pageCount=Math.max(1,pages.length);strokes=pages.length?pages:[[]];
  }
  page=Math.min(d.pg!=null?d.pg:page,pageCount-1); // 그 반이 마지막으로 보던 쪽
  docUpdated=d.updated||0;
}
function readLocal(key){try{return JSON.parse(lsGet(LS_DOC+key));}catch(_){return null;}}

/* 상태 표시 */
const ICONS={
  device:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  cloud:'<path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.3 12 4 4 0 0 0 6 19.9Z"/><path d="m9 14 2 2 4-4"/>',

  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>'

let syncState='local';
function setSync(state){

    loading:['sync','불러오는 중…','busy'],
    saved:['cloud','드라이브에 저장됨','ok'],

$('sync').onclick=()=>{

/* 자동 저장 */
function markDirty(){
  docUpdated=Date.now();driveDirty=true;
  if(accessToken)setSync('pending');
  clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,2500);
}
function saveLocalNow(){
  if(!docKey)return;
  // 이 기기 사본은 '아직 드라이브에 못 올린 필기'를 잠깐 맡아 두는 용도(pending). 드라이브에 저장되면 바로 지움
  if(!lsSet(LS_DOC+docKey,JSON.stringify({...serialize(),pending:1}))&&!lsWarned){
    lsWarned=true;toast('이 기기 저장 공간이 꽉 찼어요. 로그인해서 드라이브에 저장해 주세요');
  }
}
function flushSave(){
  clearTimeout(saveTimer);
  saveChain=saveChain.then(async()=>{
    if(!docKey)return;
    if(!driveDirty){setSync(accessToken?'saved':offlineState());return;} // 바뀐 게 없으면 아무것도 안 씀
    saveLocalNow(); // 드라이브에 올라가기 전까지만 이 기기에 맡겨 둠
    if(!accessToken){setSync(offlineState());return;}
    setSync('saving');
    try{await driveSave(serialize());driveDirty=false;lsDel(LS_DOC+docKey);setSync('saved');} // 드라이브에 저장됐으면 이 기기 사본은 지움
    catch(_){if(accessToken)setSync('error');}
  });
  return saveChain;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave();});
window.addEventListener('beforeunload',e=>{
  clearTimeout(saveTimer);if(driveDirty)saveLocalNow(); // 아직 못 올린 필기만 이 기기에 맡겨 둠
  if(driveDirty&&accessToken){e.preventDefault();e.returnValue='';} // 드라이브 저장이 덜 끝났으면 한 번 물어봄
});

/* 학습지 열 때: 이 기기·드라이브 중 더 최근 필기를 불러옴 */
async function openDoc(key,name){
  docKey=key;docName=name;docUpdated=0;driveDirty=false;
  $('noteName').textContent=noteLabel||'기본';
  let local=readLocal(key);
  let remote=null,remoteOk=false;
  if(accessToken){setSync('loading');try{remote=await driveLoad(key);remoteOk=true;}catch(_){}}
  if(remoteOk&&local){
    // 드라이브가 기준: 이미 올라간 예전 사본이나 드라이브보다 오래된 사본은 지움 (드라이브에서 지운 필기가 되살아나지 않게)
    if(!local.pending||(remote&&(remote.updated||0)>=(local.updated||0))){lsDel(LS_DOC+key);local=null;}
  }
  const best=[local,remote].filter(Boolean).sort((a,b)=>(b.updated||0)-(a.updated||0))[0];
  if(best&&best.pages&&best.pages.some(pg=>pg.length)){applyData(best);toast('저장해 둔 필기를 불러왔어요');}
  // 아직 못 올린 이 기기 필기가 남아 있으면 드라이브에 올림
  if(local&&local.pending&&(!remote||(local.updated||0)>(remote.updated||0))&&local.pages&&local.pages.some(pg=>pg.length))driveDirty=true;
  if(accessToken){driveDirty?flushSave():setSync('saved');}
  else setSync(offlineState());
}

/* ---------- 구글 로그인 ---------- */
function gisReady(){return !!(window.google&&google.accounts&&google.accounts.oauth2);}
function connect(prompt){
  if(!GOOGLE_CLIENT_ID){toast('아직 구글 클라이언트 ID가 설정되지 않았어요');return Promise.resolve(false);}
  if(location.protocol==='file:'){toast('구글 로그인은 웹 주소로 열었을 때만 돼요');return Promise.resolve(false);}
  if(!gisReady()){toast('구글 로그인 준비 중이에요. 잠시 후 다시 눌러 주세요');return Promise.resolve(false);}
  if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,scope:SCOPE,
    callback:async r=>{
      const done=pendingLogin;pendingLogin=null;
      if(r.error||!google.accounts.oauth2.hasGrantedAllScopes(r,SCOPE)){
        toast('드라이브 저장 권한을 허용해야 저장할 수 있어요');if(done)done(false);return;
      }
      accessToken=r.access_token;tokenExp=Date.now()+((+r.expires_in||3600)-60)*1000;
      lsSet(LS_TOK,JSON.stringify({t:accessToken,e:tokenExp})); // 새로고침해도 한 시간 동안은 로그인 유지
      await afterLogin();if(done)done(true);
    },
    error_callback:()=>{const done=pendingLogin;pendingLogin=null;if(done)done(false);} // 창을 닫았거나 팝업이 막힘
  });
  if(pendingLogin)return pendingPromise; // 이미 로그인 창이 떠 있으면 그 결과를 같이 기다림
  return pendingPromise=new Promise(res=>{
    pendingLogin=res;
    const hint=lsGet(LS_HINT);
    tokenClient.requestAccessToken(hint?{prompt,login_hint:hint}:{prompt});
  });
}
let pendingLogin=null,pendingPromise=null;
function offlineState(){return (user||(GOOGLE_CLIENT_ID&&lsGet(LS_HINT)))?'reconnect':'local';}
async function afterLogin(){
  try{
    const a=await (await api(DRIVE+'/about?fields=user(displayName,emailAddress,photoLink)')).json();
    user=a.user;lsSet(LS_HINT,user.emailAddress);
  }catch(_){user={displayName:'',emailAddress:''};}
  showUser();
  archivePdf(); // 로그인 전에 열어 둔 학습지 PDF도 보관
  if(!docKey)return;
  // 지금 열린 학습지: 드라이브 쪽이 더 최근이면 불러오고, 화면 쪽이 더 최근이면 올림
  setSync('loading');
  let remote=null;try{remote=await driveLoad(docKey);}catch(_){}
  const remoteHas=remote&&remote.pages&&remote.pages.some(pg=>pg.length);
  if(remoteHas&&(remote.updated||0)>docUpdated){
    if(!hasInk()||confirm('드라이브에 더 최근에 저장된 필기가 있어요. 불러올까요?\n(지금 화면의 필기는 바뀌어요)')){
      applyData(remote);lsDel(LS_DOC+docKey);driveDirty=false;await renderPage();setSync('saved');
      toast('드라이브의 필기를 불러왔어요');return;
    }
  }
  if(hasInk()){driveDirty=true;flushSave();}else setSync('saved');
}
function showUser(){

  if(!logged)return;
  const av=$('avatar');av.textContent='';
  if(user.photoLink){const img=document.createElement('img');img.src=user.photoLink;img.alt='';img.referrerPolicy='no-referrer';av.appendChild(img);}
  else av.textContent=(user.displayName||user.emailAddress||'?').trim().charAt(0).toUpperCase();
  $('whoName').textContent=user.displayName||'구글 계정';
  $('whoEmail').textContent=user.emailAddress||'';
}
$('loginBtn').onclick=()=>connect('select_account');
$('avatar').onclick=e=>{e.stopPropagation();$('acctMenu').classList.toggle('open');};
document.addEventListener('click',e=>{if(!e.target.closest('#acctMenu'))$('acctMenu').classList.remove('open');});
$('openFolder').onclick=async()=>{
  $('acctMenu').classList.remove('open');
  const w=window.open('about:blank','_blank'); // 팝업 차단을 피하려고 먼저 창을 엶

  catch(_){if(w)w.close();toast('드라이브에 연결되지 않았어요');}

$('syncNow').onclick=()=>{$('acctMenu').classList.remove('open');driveDirty=true;flushSave();};
$('logout').onclick=async()=>{
  $('acctMenu').classList.remove('open');
  await flushSave();
  if(accessToken&&gisReady())google.accounts.oauth2.revoke(accessToken,()=>{});
  accessToken=null;user=null;folderId=null;driveIds={};lsDel(LS_HINT);lsDel(LS_TOK);
  showUser();setSync('local');toast('로그아웃했어요. 필기는 이 기기에 계속 저장돼요');

// 전에 로그인했던 기기라면: 처음 버튼을 누를 때 자동으로 다시 연결 (구글 창이 잠깐 떴다 닫힘)
// 한 시간쯤 지나 연결이 풀렸을 때도 같은 방식으로 다시 연결
// 연결이 곧 풀릴 때(10분 이내)도 단추를 누르는 김에 미리 새로 받아 둠 → 수업 중에 풀리는 일을 줄임
document.addEventListener('click',e=>{
  if(!GOOGLE_CLIENT_ID||!lsGet(LS_HINT))return;
  if(!e.target.closest('#bar,#top,.side')||e.target.closest('input'))return;
  const soon=accessToken&&tokenExp-Date.now()<10*60*1000;
  if(syncState==='reconnect'||soon)connect('');
},true);
// 연결 시간이 지나면 상태 표시를 '다시 연결'로 바꿈
setInterval(()=>{if(accessToken&&Date.now()>tokenExp){accessToken=null;lsDel(LS_TOK);setSync('reconnect');}},60*1000);
// 새로고침·새 탭: 아직 유효한 연결이 있으면 그대로 이어 씀
async function restoreSession(){
  if(!GOOGLE_CLIENT_ID||!lsGet(LS_HINT))return false;
  let t=null;try{t=JSON.parse(lsGet(LS_TOK));}catch(_){}
  if(!t||!t.t||t.e<Date.now()+60*1000){lsDel(LS_TOK);return false;}
  accessToken=t.t;tokenExp=t.e;
  try{
    const a=await (await api(DRIVE+'/about?fields=user(displayName,emailAddress,photoLink)')).json();
    user=a.user;showUser();return true;
  }catch(_){accessToken=null;lsDel(LS_TOK);return false;}
}

/* ---------- 드라이브 API ---------- */
async function api(url,opts={}){
  if(!accessToken||Date.now()>tokenExp){accessToken=null;setSync('reconnect');throw new Error('no token');}
  const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+accessToken}});
  if(r.status===401){accessToken=null;lsDel(LS_TOK);setSync('reconnect');throw new Error('401');}
  if(!r.ok){const err=new Error('http '+r.status);err.status=r.status;throw err;}
  return r;
}
async function ensureFolder(){
  if(folderId)return folderId;
  const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and appProperties has { key='penApp' and value='folder' } and trashed=false");
  const j=await (await api(DRIVE+'/files?q='+q+'&fields=files(id)')).json();
  if(j.files&&j.files.length){folderId=j.files[0].id;return folderId;}
  const c=await (await api(DRIVE+'/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:'판서 그림판',mimeType:'application/vnd.google-apps.folder',appProperties:{penApp:'folder'}})})).json();
  folderId=c.id;return folderId;
}
async function findDocFile(key){
  const q=encodeURIComponent("appProperties has { key='penKey' and value='"+key+"' } and trashed=false");
  const j=await (await api(DRIVE+'/files?q='+q+'&fields=files(id)&orderBy=modifiedTime desc')).json();
  return (j.files&&j.files[0])||null;
}
async function driveLoad(key){
  const f=await findDocFile(key);
  if(!f){delete driveIds[key];return null;}
  driveIds[key]=f.id;
  return await (await api(DRIVE+'/files/'+f.id+'?alt=media')).json();
}
function fileNameOf(name,label){return (name||'빈 노트').replace(/\.pdf$/i,'').replace(/[\\/:*?"<>|]/g,'_').slice(0,80)+(label?' ['+label.replace(/[\\/:*?"<>|]/g,'_')+']':'')+' 필기.json';}
async function driveSave(data,retry){
  const body=JSON.stringify(data);
  let id=driveIds[data.key];
  if(!id){const f=await findDocFile(data.key);id=f&&f.id;}
  if(id){
    try{
      await api(UPLOAD+'/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
      driveIds[data.key]=id;return;
    }catch(e){
      if(e.status!==404||retry)throw e;
      delete driveIds[data.key];return driveSave(data,true); // 드라이브에서 파일을 지웠으면 새로 만듦
    }
  }
  const parent=await ensureFolder();
  const meta={name:fileNameOf(data.name,data.label),mimeType:'application/json',parents:[parent],appProperties:{penKey:data.key,penBase:data.base||data.key,penLabel:data.label||''}};
  const bd='pen'+Math.random().toString(36).slice(2);
  const mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
           '\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
  const r=await (await api(UPLOAD+'/files?uploadType=multipart&fields=id',{method:'POST',
    headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp})).json();
  driveIds[data.key]=r.id;
}

/* ---------- 넘김 방식: 위아래(이어 보기) / 옆으로(한 쪽씩) ---------- */
// 위아래 방식: 쪽마다 바탕 그림(PDF)과 필기 그림을 따로 그려 세로로 이어 붙이고,
// 지금 쓰는 쪽 위에만 필기 판(#stage)을 얹음. 스크롤하거나 다른 쪽을 펜으로 누르면 그 쪽으로 판이 옮겨감
let vmode=(lsGet('pen:mode')||'v')==='v';
const pagesEl=$('pages');
let slots=[],slotsSig='',pageRatios=[],ratiosFor=null,io=null,scrollTimer=null,noPickUntil=0;
const visSlots=new Set();
async function ensureRatios(){ // 쪽마다 세로/가로 비율
  if(!pdf){pageRatios=[];ratiosFor=null;return;}
  if(ratiosFor===pdf&&pageRatios.length===pdf.numPages)return;
  const doc=pdf,arr=[];
  for(let i=0;i<doc.numPages;i++){const pp=await doc.getPage(i+1),v=pp.getViewport({scale:1});arr.push(v.height/v.width);}
  if(doc===pdf){pageRatios=arr;ratiosFor=doc;}
}
function ratioOf(i){
  if(!pdf)return blankRatio;
  for(let j=i;j>=0;j--)if(pmap[j])return pageRatios[pmap[j]-1]||1.414; // 빈 페이지는 앞쪽 PDF 쪽과 같은 크기
  const f=pmap.find(v=>v);return f?pageRatios[f-1]||1.414:1.414;
}
const slotPr=h=>Math.min(window.devicePixelRatio||1,Math.sqrt(8e6/(W*h)));
function layoutSlots(){
  const sig=docKey+'|'+pageCount+'|'+Math.round(W)+'|'+(pdf?pmap.join(','):'b');
  if(sig===slotsSig&&slots.length===pageCount)return false;
  slotsSig=sig;
  stage.remove();

function htmlToRuns(root){

  if(accessToken){
    try{
      const q=encodeURIComponent("appProperties has { key='penBase' and value='"+baseKey+"' } and trashed=false");
      const j=await (await api(DRIVE+'/files?q='+q+'&fields=files(appProperties)&pageSize=200')).json();
      for(const f of j.files||[])set.add((f.appProperties&&f.appProperties.penLabel)||'');
    }catch(_){}
  }
  return sortLabels([...set]);
}
function renderLabels(labels){
  const box=$('noteList');box.textContent='';
  for(const lb of labels){
    const b=document.createElement('button');b.type='button';b.className='nchip'+(lb===noteLabel?' on':'');
    b.textContent=lb||'기본';b.onclick=()=>switchLabel(lb);box.appendChild(b);
  }
}
async function openNotePop(){
  const pop=$('notePop');
  if(!pop.hidden){pop.hidden=true;return;}
  pop.hidden=false;$('noteNew').value='';
  renderLabels(sortLabels([...new Set(['',noteLabel])]));
  renderLabels(await listLabels()); // 드라이브에 있는 반 이름까지 채움
}
async function switchLabel(lb){
  $('notePop').hidden=true;
  if(lb===noteLabel)return;
  commitText();await flushSave();
  noteLabel=lb;lsSet(LS_LAST+baseKey,lb);
  if(pdf){pageCount=pdf.numPages;pmap=Array.from({length:pageCount},(_,i)=>i+1);} // 반마다 끼운 빈 페이지가 다름
  strokes=pdf?Array.from({length:pageCount},()=>[]):[[]];if(!pdf)pageCount=1;
  page=0;laserStrokes=[];
  await openDoc(noteKeyOf(baseKey,lb),docName);
  await renderPage();if(!vmode)wrap.scrollTop=0;
  toast((lb||'기본')+' 필기');
}
$('noteBtn').onclick=e=>{e.stopPropagation();openNotePop();};
$('noteAdd').onclick=()=>{
  const lb=cleanLabel($('noteNew').value);
  if(!lb){toast('반 이름을 넣어 주세요');$('noteNew').focus();return;}
  switchLabel(lb);
};
$('noteNew').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('noteAdd').click();}else if(e.key==='Escape')$('notePop').hidden=true;});
document.addEventListener('click',e=>{if(!e.target.closest('#notePop,#noteBtn'))$('notePop').hidden=true;});

/* ---------- 학습지 PDF 보관 ---------- */
// 로그인 상태에서 PDF를 열면 '판서 그림판' 폴더에 PDF를 한 번만 올려 둠 (같은 PDF는 다시 올리지 않음)
const archived={}; // 학습지 열쇠 → 드라이브 파일 id
async function archivePdf(){
  const key=baseKey,bytes=curPdfBytes,name=docName;
  if(!accessToken||!pdf||!bytes||!key||key==='blank'||archived[key])return;
  try{
    const q=encodeURIComponent("appProperties has { key='penPdf' and value='"+key+"' } and trashed=false");
    const j=await (await api(DRIVE+'/files?q='+q+'&fields=files(id)')).json();
    if(j.files&&j.files.length){archived[key]=j.files[0].id;return;}
    const parent=await ensureFolder();
    const meta={name:/\.pdf$/i.test(name)?name:name+'.pdf',mimeType:'application/pdf',parents:[parent],
      appProperties:{penPdf:key,penType:'pdf'}};
    const bd='pen'+Math.random().toString(36).slice(2);
    const body=new Blob([
      '--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n',
      '--'+bd+'\r\nContent-Type: application/pdf\r\n\r\n',bytes,'\r\n--'+bd+'--'
    ]);
    const r=await (await api(UPLOAD+'/files?uploadType=multipart&fields=id',{method:'POST',
      headers:{'Content-Type':'multipart/related; boundary='+bd},body})).json();
    archived[key]=r.id;
  }catch(_){
    if(accessToken)toast('학습지 PDF를 드라이브에 올리지 못했어요 (필기는 저장돼요)');
  }
}

/* ---------- 드라이브 학습지 목록 ---------- */
let dlgFiles=[],dlgNoted=new Set(),dlgLabels={};
const PDF_ICON='<svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/></svg>';
const BLANK_ICON='<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
function fmtDate(iso){
  const d=new Date(iso),now=new Date();
  const md=(d.getMonth()+1)+'월 '+d.getDate()+'일';
  const hm=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
  return (d.getFullYear()===now.getFullYear()?md:d.getFullYear()+'년 '+md)+' '+hm;
}
function dlgMsg(text){const l=$('dlgList');l.textContent='';const m=document.createElement('div');m.className='dmsg';m.textContent=text;l.appendChild(m);}
async function openDriveDlg(){
  if(!GOOGLE_CLIENT_ID){toast('구글 클라이언트 ID가 설정되지 않았어요');return;}
  if(!accessToken){
    const ok=await connect(lsGet(LS_HINT)?'':'select_account');
    if(!ok)return;
  }
  $('driveDlg').hidden=false;$('dlgSearch').value='';
  await loadDriveList();
  $('dlgSearch').focus();
}
async function loadDriveList(){
  dlgMsg('불러오는 중…');
  try{
    const parent=await ensureFolder();
    const base="'"+parent+"' in parents and trashed=false and ";
    const [pdfs,notes]=await Promise.all([
      api(DRIVE+'/files?q='+encodeURIComponent(base+"mimeType='application/pdf'")+'&fields=files(id,name,modifiedTime,appProperties)&orderBy=modifiedTime desc&pageSize=200').then(r=>r.json()),
      api(DRIVE+'/files?q='+encodeURIComponent(base+"mimeType='application/json'")+'&fields=files(id,modifiedTime,appProperties)&pageSize=500').then(r=>r.json())
    ]);
    // 필기를 마지막으로 고친 시각을 목록 정렬에 반영
    const noteTime={};dlgNoted=new Set();dlgLabels={};
    for(const n of notes.files||[]){
      const ap=n.appProperties||{};if(!ap.penKey)continue;
      const base=ap.penBase||ap.penKey,lb=ap.penLabel||''; // 예전 필기(반 이름 없음)는 '기본'
      dlgNoted.add(base);(dlgLabels[base]=dlgLabels[base]||new Set()).add(lb);
      if(!noteTime[base]||n.modifiedTime>noteTime[base])noteTime[base]=n.modifiedTime;
    }
    dlgFiles=(pdfs.files||[]).filter(f=>f.appProperties&&f.appProperties.penPdf).map(f=>{
      const k=f.appProperties.penPdf,t=noteTime[k]&&noteTime[k]>f.modifiedTime?noteTime[k]:f.modifiedTime;
      return {id:f.id,name:f.name,key:k,time:t};
    }).sort((a,b)=>a.time<b.time?1:-1);
    renderDriveList();
  }catch(_){dlgMsg(accessToken?'목록을 불러오지 못했어요. 새로 고침을 눌러 주세요.':'드라이브 연결이 풀렸어요. 창을 닫고 다시 열어 주세요.');}
}
function labelsText(base){ // 목록에 반 이름들 표시: '기본, 1반, 2반'
  const set=dlgLabels[base];if(!set||(set.size===1&&set.has('')))return '';
  return sortLabels([...set]).map(l=>l||'기본').join(', ');
}
function renderDriveList(){
  const l=$('dlgList'),q=$('dlgSearch').value.trim().toLowerCase();
  l.textContent='';
  const mk=(icon,cls,name,sub,badge,isCur,onClick)=>{
    const b=document.createElement('button');b.className='ditem'+(isCur?' cur':'');
    const ic=document.createElement('span');ic.className='ic'+(cls?' '+cls:'');ic.innerHTML=icon;
    const tx=document.createElement('span');tx.className='tx';
    const nm=document.createElement('span');nm.className='nm';nm.textContent=name;
    const sb=document.createElement('span');sb.className='sub';sb.textContent=sub;
    tx.appendChild(nm);tx.appendChild(sb);b.appendChild(ic);b.appendChild(tx);
    if(badge){const bg=document.createElement('span');bg.className='badge';bg.textContent=badge;b.appendChild(bg);}
    b.onclick=onClick;l.appendChild(b);
  };
  if(!q||'빈 노트'.includes(q))
    mk(BLANK_ICON,'blank','빈 노트',labelsText('blank')||'PDF 없이 빈 페이지에 쓰기',dlgNoted.has('blank')?'필기 있음':'',baseKey==='blank',
      async()=>{closeDriveDlg();await openBlank();});
  const list=dlgFiles.filter(f=>!q||f.name.toLowerCase().includes(q));
  for(const f of list){
    mk(PDF_ICON,'',f.name.replace(/\.pdf$/i,''),fmtDate(f.time)+(labelsText(f.key)?' · '+labelsText(f.key):''),dlgNoted.has(f.key)?'필기 있음':'',baseKey===f.key,
      ()=>openFromDrive(f));
  }
  if(!list.length&&!dlgFiles.length&&!q){
    const m=document.createElement('div');m.className='dmsg';
    m.textContent='아직 보관된 학습지가 없어요. 이 기기에서 PDF를 한 번 열면 여기에 생겨요.';l.appendChild(m);
  }else if(!list.length&&q){
    const m=document.createElement('div');m.className='dmsg';m.textContent='찾는 학습지가 없어요.';l.appendChild(m);
  }
}
async function openFromDrive(f){
  dlgMsg('"'+f.name+'" 여는 중…');
  try{
    const buf=await (await api(DRIVE+'/files/'+f.id+'?alt=media')).arrayBuffer();
    archived[f.key]=f.id;
    closeDriveDlg();
    await openPdfBuffer(buf,f.name,buf.byteLength);
  }catch(_){toast('학습지를 열지 못했어요');renderDriveList();}
}
function closeDriveDlg(){$('driveDlg').hidden=true;}
$('driveOpen').onclick=openDriveDlg;
$('dlgClose').onclick=closeDriveDlg;
$('dlgRefresh').onclick=loadDriveList;
$('dlgSearch').addEventListener('input',renderDriveList);
$('driveDlg').addEventListener('click',e=>{if(e.target.id==='driveDlg')closeDriveDlg();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('driveDlg').hidden)closeDriveDlg();});

/* ---------- 시작 ---------- */
try{setPenType(localStorage.getItem('pen:penType')||'cal');}catch(_){setPenType('cal');}
syncSwatches();
updateNib();
if(!GOOGLE_CLIENT_ID){$('loginBtn').hidden=true;$('driveOpen').hidden=true;} // 클라이언트 ID가 없으면 로그인·드라이브 단추 숨김
(async()=>{
  const restored=await restoreSession(); // 한 시간 안에 다시 열었으면 로그인 그대로
  noteLabel=lastLabelOf('blank');
  await openDoc(noteKeyOf('blank',noteLabel),'빈 노트');
  if(!restored&&GOOGLE_CLIENT_ID&&lsGet(LS_HINT))setSync('reconnect'); // 전에 로그인한 기기: 단추 하나 누르면 다시 연결
  renderPage();
})();
</script>
